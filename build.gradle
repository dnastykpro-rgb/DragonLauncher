plugins {
    id 'java'
    id 'application'
}

group = 'com.dragon.launcher'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'com.dragon.launcher.DragonLauncher'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.dragon.launcher.DragonLauncher'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
